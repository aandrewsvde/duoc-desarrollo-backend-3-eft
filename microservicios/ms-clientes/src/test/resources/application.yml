# Configuracion exclusiva de las pruebas de ms-clientes.
#
# No consulta al config-server ni se registra en Eureka: una prueba que
# dependiera de infraestructura externa dejaria de verificar el codigo y pasaria
# a fallar por motivos ajenos a lo que se quiere comprobar.
spring:
  cloud:
    config:
      # Sin esto, el cliente de configuracion exige un spring.config.import y
      # aborta el arranque antes de leer nada mas.
      enabled: false
  config:
    import: ""
  datasource:
    # H2 en modo PostgreSQL: respeta la sintaxis del motor real, de modo que
    # las mismas sentencias que en produccion se ejecutan aqui.
    url: jdbc:h2:mem:clientes;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  sql:
    init:
      mode: always
      # El MISMO esquema que produccion, no una copia: una copia se
      # desincroniza en silencio y las pruebas acaban validando una estructura
      # que ya no existe.
      schema-locations: classpath:db/esquema.sql
  kafka:
    bootstrap-servers: localhost:59092
    consumer:
      group-id: ms-clientes-pruebas
    listener:
      # Los consumidores no arrancan: estas pruebas verifican la logica, no el
      # transporte. Dejarlos activos solo llenaria la salida de reintentos
      # contra un broker que no existe.
      auto-startup: false
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:59000/oauth2/jwks

server:
  port: 8084

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

banco:
  segmento:
    umbral-preferente: 20000
